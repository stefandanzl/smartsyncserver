version: '3.8'

services:
  smartsyncserver:
    build: .
    container_name: smartsyncserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount vault data directory
      - ./vault:/data/vault
      # Mount config file (create this locally first)
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
