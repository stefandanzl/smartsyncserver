# SmartSyncServer Configuration

vault:
  path: ./vault

# Git integration (optional)
git:
  # autocommit_minutes: 60
  # access_token: your-github-token
  # repository_url: https://github.com/username/repo.git
  # commit_message: Automatic SmartSyncServer commit
  # commit_message supports placeholders expanded at commit time
  # (times use the server's local timezone, see the TZ env var):
  #   {date_day}      -> "2026-06-20"     (date)
  #   {date_time}     -> "2026-06-20 14:30"   (date + time, no seconds)
  #   {date_daytime}  -> "14:30"          (clock time, no seconds)
  #   {date_epoch}    -> "1779000000"     (unix seconds)
  #   {files_total}   -> "5"             (total files in the commit)
  #   {files_added}   -> "2"             (added, incl. renamed/copied)
  #   {files_modified}-> "2"             (modified)
  #   {files_deleted} -> "1"             (deleted)
  # Example: commit_message: "{date_time} | +{files_added} ~{files_modified} -{files_deleted}"

# Scan settings
scan:
  on_startup: true # Scan vault when server starts
  api: true # Update checksums on API changes
  on_change: false # Watch for filesystem changes (not implemented yet)
  periodic_interval: 300 # Periodic scan interval in seconds (0 = disabled)

# Ignore patterns (glob-style)
ignore:
  - ".git*"

# Authentication (leave token empty to disable auth)
auth:
  token: your-secret-token-here

# Server settings
server:
  port: 8080
  bind: 0.0.0.0
